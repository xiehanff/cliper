name: cliper
description: "Cliper Flutter desktop rebuild - clipboard history manager."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Desktop capabilities
  window_manager: ^0.3.9
  tray_manager: ^0.2.3
  hotkey_manager: ^0.2.3
  launch_at_startup: ^0.3.1
  super_clipboard: ^0.8.24
  clipboard_watcher: ^0.2.1
  screen_retriever: ^0.1.9

  # State management
  provider: ^6.1.2

  # Files / paths / i18n / utilities
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/tray_icon.ico
    - assets/icons/

  fonts:
    - family: PingFang SC
      fonts:
        - asset: assets/fonts/PingFangSC-Regular.ttf
          weight: 400
    - family: GoogleSansMono
      fonts:
        - asset: assets/fonts/GoogleSansMono-Regular.ttf
          weight: 400
